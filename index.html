<script id="chapter-1" type="text/plain">
第一章

　　早些年他还会幻想自己在返校节橄榄球赛上赢得校园金球奖，在所有人艳羡的目光里走向领奖台，把那台号称镀金而实则铜皮漆面再过三个月就会脱落的奖杯拿在手里，向四面八方鞠躬，再风风光光地走下台，搂住人群里欢呼声最响的那个女孩儿，然后狠狠吻在她樱桃味的粉色唇膏上。

　　三个月前他就跟他七年级的堂弟说过这件事，那会儿他们的爸爸妈妈们结伴去了迈阿密海滩度假，堂弟要参加七月中旬的校园科技展，而汉克·安德森需要在一个月里战胜那个拿蛋白粉当怡健可乐喝的肌肉狂，加入学校橄榄球队担任四分卫，所以他们都留在了家里。他说她叫露易丝·琼，全校没有人不认识她，连续三年的返校女王，至少三十个男生想邀请她在毕业舞会上共舞一曲。而“她的心里只有我。”他说。他那个忙着给航模社研究塑料飞机防火引擎的书呆子堂弟没时间搭理他，而他又觉得这件事情如果没有第二个人知道的话，那将会比阿里阿德涅被留在纳克索斯岛上还要遗憾两百多倍，于是他又继续说了下去。

　　“我见到她的第一眼就知道，我一定要带她回去见我妈妈。她的头发是金色的，不是长着长着就会莫名其妙变成棕色或者别的什么颜色的金色，是那种完美得像金毛肚子上的毛发一样的金色。虽然苏珊·福克斯说不止一次见到过她去街上的理发店，但那能代表得了什么呢？我的意思是，我也去理发店，她也去理发店，你肯定也去过理发店，这就能代表她的金发是漂出来的吗？”

　　只可惜突击喝了一个月蛋白粉的汉克·安德森没能战胜从生出来那天起就被他爸把蛋白粉当奶粉喂的肌肉狂，成为了一名光荣的替补，在参加了两个月的突进训练后，最终获得了站在赛场内围观看比赛的殊荣。当时招募他入队的体育老师拍胸脯向他保证，只要你参与训练，最终无论你有没有上战场，我们的奖杯都有你一份。他当真信了他的邪，如果不是在校园名人墙上看到那张自己被裁得只剩一只搭在中锋肩上的手的照片的话。

　　总之他没能借着橄榄球的名义接近返校女王，毕业舞会那天他的手花也没机会送出去，但他仍旧相信她的心里一定是有他的，否则没法解释为什么每次他去镇上书店打工，都会遇到她去买咖啡这件事。“制造偶遇的机会。”他说着，挠了挠自己的头皮，露出一个不怎么有所谓的笑。

　　他认为真正的爱情都是骑士与公主式的，勇敢、忠诚、守护以及毫不动摇的信念。他的意思是，如果一段爱情中没有任何拯救与被拯救的关系，那么爱情是不会长久的。他手舞足蹈地开始比画起来，手里啤酒瓶里的半瓶子酒晃荡个不停。他将骑士与公主的定义拉得十分广泛，并非一定授勋过的才能叫骑士，堂吉诃德早就告诉过他：这世界上只有两种人，有骑士精神的人以及没骑士精神的人。

　　就像他会每天默默等露易丝·琼从教室里走出来以后他才背上书包正式放学一样。他们的家隔了一个街区，为了有正当理由送她回家，他还特地花了一整天的时间把他爸的登山自行车洗干净重新上漆。她的头发被风吹着飘到他后脖颈上的时候，他觉得就算是油漆过敏也值了；过敏起的红疹三天就能消退，而发梢拂过皮肤的触感一辈子都忘不掉。只可惜他也就送了她两回。一周后露易丝那个在西班牙上大学的哥哥毕业回来，开了辆绿色的梅赛德斯停在学校门口，她坐上车后留给他最后的念想就是一个飞吻。

　　因为汉克·安德森的一生都充满了坎坷。虽然每当他说这话的时候他妈妈都会用拖鞋扔他，但依旧没能改变他刻进脑脊髓液里的废料想法。如果时间够的话，他能用三十张A4纸来一一列举他从出生那年一直到现在的二十三年人生里究竟遭逢过多少磨难。他说他觉得这一切都是命中注定的，从妇产医生在接生时把他左胳膊先拽出来的时候就注定了。

　　他妈一怀上他就去找了塔罗师给他算命，三张牌，正位教皇、逆位宝剑六、正位权杖骑士，花八百刀买了一个紫水晶窟才得一窥天机。她说你肚子里这位小天使的一生都将顺风顺水，只不过需要一点小帮助。他妈问是要买这个味道闻上去像死老鼠和猩猩交配的蜡烛香薰，还是要买那个长得像它们的儿子一样的怪物胸像？塔罗师说什么都不用买，只需要妇产医生在接生时，把他的右胳膊先拽出来就可以了。妈妈问为什么，她说你看这三张排面，是不是都是右手在上？

　　“她居然觉得她说得有道理！你敢相信吗？我说恐龙在六千万年前就灭绝了，她都不肯相信，说我放屁，因为她在纽约市立博物馆看到了会动的恐龙；而她竟然会去相信一个塔罗师？还是因为这么荒诞的理由！”

　　当然汉克·安德森这么生气多半也是因为他妈在生她的时候选择了剖腹产，打了麻药一觉睡到第二天饭点，完全忘了要监督医生先把他右胳膊拽出来这件事。等她想起来这茬的时候她儿子已经学会骑四轮自行车了，轮子磕在减速带上，把他从车上颠到路边浇花用的绿色水管上。她捶胸顿足、哭天抢地，说，我就知道，我早就知道，左胳膊先出来一定没有好事！

　　他会说他一生的不幸都是从他被水管缠住的那个下午开始的，四岁看大象被象鼻子吸走头顶的头发，六岁和爸爸去湖边钓鱼结果鱼饵被偷，十岁用没写过的作业本折纸飞机、导致半个学期没交作业，老师都以为汉克·安德森转学去了另一所私立学校……一直到大学毕业后上警校那一年，杰弗里·福勒告诉他，金球奖是他妈颁给踢足球的奖项，你扔橄榄球扔一辈子扔到老死都得不到金球奖。同一天他在ig上刷到了露易丝·琼的婚礼预告，照片里她穿着白色婚纱，手里握着一捧白色铃兰花，头发应当是很久没漂了所以变成了棕色。“她还是很漂亮，”他说，“如果她还去返校节的话她依然会是当之无愧的返校女王，我会把我手里的所有选票全部投给她。”只是照片里搂着她腰笑得阳光灿烂的人是苏珊他妈的福克斯。

　　“我总觉得，人再倒霉，也该有个头吧？你说是不是？”他喝了一大口啤酒，又哇地一下全部吐出来，靠在栏杆上一边咳嗽一边擦嘴。他原本以为在经历过这一切之后的内心已然变得强大，不以物喜、不以己悲，不会再有能够轻易伤到他的人和事，但现实还是毫不怜惜地给了他一次重击。“我当然是想要干出一番事业的，我还年轻，对吗？总不能和那些五六十岁还在干巡警的人一样混日子等退休吧？可当我说我想要重新调查那桩旧案，你猜猜我们局长和我说什么？”

　　“说什么？”

　　汉克打了个酒嗝，双手撑着栏杆把自己的上半身撑直，摇头晃脑地说：“他让我操我自己。”

　　“所以这就是你大半夜出现在酒吧门口、吐个天昏地暗，再拉着一个你不认识的人诉了半天苦的真正原因？有人让你操你自己？”男人一边帮他拍背顺气一边问他。

　　汉克先是闭上眼睛，过了三秒后重新睁开，视线还是有点不聚焦，只能模模糊糊看清面前的男人穿着黑西装和长外套，脸上还戴着一副眼镜。他仰着头问：“那你呢，你为什么在这里？”

　　“我过来出差。”男人回答。

　　“哦，无聊。”他猛地把身体支起来，踉跄地走了两步，差点儿又摔下去，男人眼疾手快一把把他捞住，他把胳膊架在男人肩膀上，脸凑到他面前眯起眼睛看了半天，然后说：“我有个提议，我们可以一起去做点不无聊的事情。”

　　男人拽着他的手臂把他扶正，好似嗤笑了一声：“你这种话术我三十年前就听过了，找人约炮也得动动脑子想点新花样。”

　　“真的吗？”汉克又把脸凑得离他更近一点，然后豁然开朗：“你长得还挺好看的，他们想约你也正常。”

　　这次男人真的笑了，汉克听到了他的笑声，只是被酒精腐蚀的大脑让他没那么快能反应过来他笑声的含义，事实上他才刚刚理解男人说的上一句话：“什么三十年前？你现在多大岁数？”

　　“我五十三了。”

　　“操，我不信。我看你最多也就四十。”他笃定道。

　　男人再一次被他逗笑，扶了扶快要滑下来的眼镜，说：“这句比刚才那句好多了。”

　　“那你愿意陪我吗，今晚？”他另一只手从男人身前绕过，抓住自己垂在他肩膀上另一只手的手腕，整个人挂在他身上，得寸进尺般地把头靠在男人肩上。男人比他矮一些，这个动作让他的脖子和腰十分别扭地弯着，甚至还要把屁股向左撅出去才能让他们的身高持平。

　　男人没让他在难受的姿势维持太久，很快就说：“为什么不呢？”

　　于是他们一起去了酒店。

　　汉克把男人压到床上的时候又忽然有了力气，不像个连路都走不稳的醉鬼。他拽着他的领带想要把他衬衫扣子扯开，男人更用力地推开了他，自己几根手指上下交替着飞快解开了前几粒扣子，汉克看得头晕眼花，眼神还飘在他胸口露出来的皮肤上，就被男人拽着领子倒在他身上，结结实实地啃上了他的嘴唇。

　　汉克把阴茎插进他屁股里的时候男人疼得直抽气，自打两年前做过髋关节手术之后就没受过这份罪，忍了几下最终还是决定不忍了，开口道：“你先停一停，你没和你以前的对象上过床吗？”

　　汉克也是急得满头大汗，半根东西卡在里面进不来也出不去，一听这话误以为自己的性能力遭到了质疑，急头白脸地又挺腰往里送了几公分，顶得男人差点儿两眼一翻昏过去。

　　他说：“妈的，当然睡过。”

　　“那你怎么就不知道轻一点呢？”他往后抓了两下头发，叹了口气，气若游丝。

　　“我又没和男的睡过！”汉克理直气壮地回答：“你睡过，你教教我该怎么弄。”

　　“这么急，我还以为你睡过多少……”男人两条胳膊撑在床上把自己上半身支起来，脸上的镜片也因为这个动作往下滑了滑。他好声好气地同他商量：“你先出去，我告诉你该怎么…哎！”

　　话还没说完，汉克抓着他的腰直接一顶到底，整个人倒回床上的时候男人连自己墓地在哪都选好了。他说我预计原本要活到七十的，现在照你这么搞下去，能不能活到五十五都很难说。

　　汉克觉得自己得到了夸奖，变得有些得意，还以为弄对了地方，两手捏着他的腰拖向自己，一个劲儿地朝刚才的地方猛攻，一连顶了几十下。男人彻底发不出声音来，右手虚虚地抓住枕头一角，左手勉强抬起来想要扶住眼镜，又叫年轻人抓住手腕压到头顶，仰头被拖进一个深吻里，亲得他镜片有点起雾。

　　也就汉克另一只手忙着解他剩下的衬衫扣子这会儿身下才稍得歇一歇，他赶忙抓住机会把汉克从自己身上推开，被润滑油沾湿的阴茎顺势从他屁股里滑出来。年轻人不满地咕哝一声，猴急着想要塞回去，他连忙把岔开的两条腿并拢，侧身躺在床上，说：“我有点累了，换个姿势。”

　　汉克说你体能不行，这才多久就累了，按照我们以前警察学院里的训练标准至少每天两小时的平板支撑，下次换体位的时候你也练练。

　　男人伸出一条手臂盖在脸上：“我哪里能和你们这帮年轻人比。”

　　汉克好不容易把他扣子全解开，领带的结又是他没见过的复杂样式，下意识差点儿想问这是什么打法，一想到这家伙真有可能一边叫床一边从十八世纪法国宫廷礼仪开始给他讲解这条领带的起源，于是把问题吞回肚子里，重新把阴茎插回他淌着水的洞里。男人闭着的睫毛轻微颤了颤，脸往枕头里埋得更深了点，直到察觉到汉克的手顺着腰侧一路摸到胸口捏住乳尖才突然有了反应。

　　他的手搭在他的手腕上，发现拽不动以后着急开口，刚发出声音就飘到了十几里外。他又清了两下嗓子，稳住声音说：“你操就操了，乱摸什么。”

　　汉克一听这话便不高兴了，更用力地捏了两下，把原本柔软的乳尖捏得泛红立在胸口，不停用指尖搓揉，问：“干嘛，不能摸吗？”

　　男人不知是被气笑还是逗笑，又没力气把他的手拽开，无奈地说：“什么都没有，有什么好摸的。”

　　“你管我，我就摸。”

　　汉克也跟着躺下来，紧贴着他的后背，将人整个拢进怀里，贴着他后颈的皮肤用牙齿轻轻地咬。手臂发力固定住他的腰，下身一刻也不停地往更深处送。男人原先压在嗓子里的呻吟愈发收不住，射精的时候沙哑地叫起来，把脸埋进枕头里，后半截声音全都吞了回去。汉克抱着他用力操了几十下，尽数泄在他身体里，怀里的人连动的力气也没有，脱水的鱼一样任他摆弄自己，又亲又抱地说了几分钟梦话，最后就这么直接睡过去。

　　“很大很大。”杰弗里回答：“四星警衔那么大。”

　　“我不是来报案的。”那人有点尴尬地说。

　　“自首也得排队。”

　　汉克走到自己桌前，接过那人递给他的耳机，然后愣在了原地。

　　“操。”

　　这个和他昨晚一夜情对象长着一模一样面孔的男人脱掉黑色大衣，露出里面四星警衔的肩章，向他伸出右手，笑着说：“你就是汉克·安德森警员吧，很高兴再一次见到你，想必你已经知道我了。”

　　“操。”

　　“我觉得当下并不是谈论这件事情的好时候，你觉得呢？”男人脸上又露出尴尬的表情，扯了扯手上的黑色手套，两手交握在身前看着他。

　　“操。”汉克发誓他有很多话想说，他最想问的是为什么今天早上一声不吭地就走了——显然这个问题已经有了答案；他还想问是不是早就知道自己是谁，为什么会出现在这里，今晚有什么打算。但所有话凝聚到嘴边，他的上排牙齿又一次咬住了下嘴唇。在他第四次重复这个单词之前，男人伸出手示意他闭嘴。

　　“三天前你向总部提交了一封举报信，举报康纳·施特恩探员在三十年前的一桩连环杀人案中玩忽职守导致重要证物遗漏。”男人一边说着，一边从公文包里拿出一份用牛皮纸封装着的文件，打开线圈，从里面取出一份印有亲笔手写电子签名的举报信。

　　“很不巧，这封举报信的最终受理人是我。我觉得你信中所提到的问题有理有据，所以我决定亲自过来听听你关于当年那桩案件的看法。”

　　汉克咬紧嘴唇，把后半个单词咽回去，在心里朝着老妈摆在鞋柜上的紫水晶窟鞠了两躬，深吸一口气，飞快打开了自己的电脑，将他从卷宗中整理出来的报告打开，然后像心里演练过一百次那样向男人展示他所列举出的种种疑点：“当年录入系统的受害者一共有五人，其中有三人是在案件定性为连环杀人案前被发现的，死者均为没有工作，或者没有固定住址的性工作从业女性，死因均为机械性窒息，现场没有任何凶手留下的DNA或者指纹。除了这一件。”

　　他点开一张图片，是一件深红色的皮质夹克衫：“当时法医在这件死者的衣服上提取到一枚带血的指纹，这明明是很清晰的调查方向，但负责受理这桩案件的警员却以证据不足的名义将案件归档，我合理怀疑他利用职权徇私枉法，帮助真凶逃脱追捕，他们之间一定有不可告人的秘密交易。我的切入点就是这个名叫康纳·施特恩的人，只要我们找他询问当年的事情，他就一定会露出马脚。”

　　汉克一口气把他的推测全部说完，昂首挺胸地叉着腰。男人弯下腰，把头凑到他的电脑屏幕前，仔仔细细看了一遍后，重新直起身，认可地点点头：“你说得很对，重启案件很有必要，而且为了保护证据不被破坏，我将全权负责本次工作。我需要你配合我的工作，汉克·安德森警员。”

　　“当然，长官。”汉克并腿站直身体朝他敬了个礼，而后很快放松下来，咧开嘴笑着问他：“既然我们是搭档了，那我是不是得知道你的名字？”

　　“当然。”男人把手套从手上摘下叠放在口袋里，语气轻描淡写地说：“我叫康纳·施特恩。”

　第三章


  　汉克·安德森的一生中一共受到过四次冷遇。

　　第一次是在二年级校园圣诞汇演，他报名参演话剧《茜茜公主》，向他妈借那条她在蜜月旅行时最爱穿的黄色百褶裙。他妈问他是自己穿，还是借给班上那个漂亮得像洋娃娃一样的小姑娘穿。汉克觉得他妈不够大度，若是把裙子借给别人她一定会心疼，隔壁南希阿姨每次问她借洗衣粉她都要推三阻四。为了演出能够顺利进行，他坦然把这份重担扛到了自己的肩膀上，拍着胸脯说当然是我穿，我们音乐老师说了，再没有比我更适合茜茜公主这个角色的人了。

　　第二次是和他爸一起去河边钓鱼，打开露营车里的罐头发现里面窝了几百只红色长条状的虫子，还以为是罐头变质，于是把虫全倒进草地里。为了不让他爸因为没有东西吃而失望，他跑到河里去洗干净罐头，把自己从家带出来的聪明小熊曲奇饼干装了进去。他爸打开罐头盖时他神色自若地从里面拿出一块塞进嘴里，说这个牌子的饼干味道真不错，下次认准这个罐头买，保准没错。

　　也是在那一次他彻底记住了Tuna不是曲奇的意思，永远都不会是，就算他狡辩这是金枪鱼味的饼干也没用。

　　第三次他和他家狗一起洗澡，在浴缸里放满水，然后把金毛搬进去，往它身上挤沐浴露。汉克足够大度，毫不吝啬地把他专用的神奇小孩沐浴香波先给狗用，等狗身上起了泡，再刮点到自己身上。在此之前他们之间的相处还挺愉快的，至少狗从来没有拒绝他。但狗的毛发实在旺盛，他的小瓶装香波全部打完了也没起多少沫，于是他又从架子上拿来了他妈的香波，刚挤出来就是泡沫状，更蓬松更柔软。他说还是大人会买东西，这么好的沐浴露他从来都没有用到过。

　　狗开始叫的时候他还以为是水温太低的缘故，一边开热水一边继续往狗身上挤泡沫。爸妈回来开门以后看到的就是这样的场面，半边没狗毛了的狗追着全身都没了汗毛的汉克满屋子乱跑，用空的沐浴露和脱毛膏瓶子滚了一地。狗身上的毛花了三个月的时间才长出来，汉克右腿至今都是光溜溜的。

　　这四次冷遇让他下定决心不会让身边的人经历和他一样的悲惨遭遇，正是因为他明白被拒绝、被无视、被冷眼相看是什么样的滋味，所以才友善对待身边的每一个人。他一度以为自己真的做到了，就算是那些招人烦的家伙凑上来招惹他，他也会痛快地骂回去，至少他不会无视人家，让对方的敌意和挑衅被遗落在风里。

　　“这简直是上帝都在帮助我们！”汉克忍不住拍手，几乎就要跳起来：“要我说就是他了，没跑，遮遮掩掩过了三十年，总有暴露本性的时候。”

　　他们马不停蹄地赶回DPD调取有关弗格森·霍奇的全部资料，发现他生于1945年，曾经在教会里当过牧师，于1965年成婚，两人养育了一个儿子，他的妻子在十多年前去世。眼下霍奇已经73岁，在科克镇经营着一家名叫“霍普韦尔儿童之家”的小型福利院。在看到他与在福利院长大的孩子们的合影时，两个人互相对视了一眼，汉克张了张口，见康纳也有要说话的意思，就示意他先说。

　　“1945年出生，1988年时他43岁，当过牧师说明他受过高等教育，大致符合我当年对他的推测。”康纳说完，侧过头看向旁边发呆的人，问：“你觉得呢？”

　　“或许我们可以查查他的医疗记录？我记得你在侧写里有提到过，凶手做过左腿股骨颈手术。”汉克绞紧眉毛思考一番后提议。

　　康纳点点头：“他这几天没有出入境记录，他的车也没离开过底特律。如果不是通过别的特别路径离开了美国境内，他现在应该就在这里。”

　　“都一把年纪了他还能偷渡不成？”汉克有些不屑地说，没注意到身边另一个老头脸上有些微妙的表情。

　　他们从信息库里导出弗格森·霍奇记录在案的所有诊疗记录，发现他曾在六十岁时做过一次心脏搭桥手术，除此之外再也没有重大手术记录，也没有哪项报告显示出他左腿受过伤。汉克知道这不会是当年的侧写出了问题，他翻过所有的现场照片，凶手在杀人现场留下的脚印都是一深一浅，左腿步展平均比右腿短了十几公分，如果不是腿部受过伤害则绝不可能留下这样的脚印。

　　出于为了混淆视听的目的而提前在腿上绑沙袋的可能只在汉克脑子里闪过一下就被他无视了。但考虑到案发时间在三十年前，他受伤的时间只会更早，那会儿医疗管理系统还不健全，很有可能他确实做过腿部手术，只是没有记录下来。他把这个想法说出来时，康纳什么都没说，只是点了点头。

　　汉克又接着调取了更多三十年前至今的更多档案，从密密麻麻的文字流里发现霍奇的妻子去世前和他打过不下三次离婚官司，每次都因为财产分配问题到最后不了了之。而在他们的儿子去世后两人就此分居，妻子搬去了马萨诸塞州，一直到病逝也没再见过面。

　　“他们的感情不太好。”他说。

　　“这个男人可能有性功能障碍，感情不好也正常。”康纳面不改色地说。

　　汉克不得不承认自己到底是年轻，无论是社会经验还是脸皮厚薄程度在这个已经是总督察的男人面前都排不上号，当他还在为两人前一天晚上不能轻易说出口的会面多愁善感的时候，康纳·施特恩就已经能够在大庭广众之下对一个陌生男人的性能力大谈特谈。最重要的是，他还能在说完这句话后摆出十分认真的表情，仿佛当真说了一个合情合理的推测，反倒让汉克觉得是自己思想太过肮脏，非要把本该公事公办的话题浪漫化。

　　“不管怎么样，我们现在去一趟他家吧。”汉克抹了一把脸，让自己的面部表情平静下来。

　　康纳跟着他从座位上站起身，关掉了电脑，说：“我们现在确实得出去一趟，不过不是去霍奇的家里，而是去医院。”

　　“去找三天前和他在那个什么什么俱乐部闹事的人？”汉克很快理解了他的意思。

　　“对，贸然去找他只怕会打草惊蛇，我推测他目前没有离开底特律的打算，所以我们最好在去找他之前把能了解到的情况全部掌握。”康纳把挂在椅背上的外套穿在身上，抬起手臂想要伸进袖管里的时候忘了自己上午才受过伤，抬到一半就疼得五官都皱在了一起，最后只是将外套草草披在了肩膀上，公文包拿在手里。

　　他从包里掏出车钥匙，隔空抛给了汉克：“开我的车去。”

　　然而去医院的走访一无所获，和霍奇发生冲突的男人因为伤势过重，已经在重症监护室躺了三天了，至今仍在昏迷。主治医生说他是重度脑震荡，来医院时的救护车钱都还是俱乐部负责人垫付的，也联系不上他的朋友和家人。当问起当天发生了什么的时候，医生也说不上个所以然来，想要知道细节还得去那家出事的俱乐部。但显然这已经偏离了他们真正的调查目的。

　　“弗格森·霍奇今年73岁，没有父母、没有配偶，甚至没有子女在世。”两个人离开医院时康纳叹了口气：“刚刚谁说上了年纪的人就不能偷渡了？他这么大岁数了还能把四十几岁的壮汉打到重度脑震荡，自己却一点事情都没有。”

　　汉克还在看手机里那天他们闹事后在DPD做的笔录，没听清他说了什么，回过神来的时候只听见后半句：“……别老觉得年纪大的人就什么都做不了了。”

　　“我可没有说你年纪大。”他笑着，下意识反驳道。康纳没接茬，还是把车钥匙扔到他手里指挥他去开车。

　　回去的路上汉克照例往去DPD的路上开，到路口时坐在旁边一路沉默的总督突然给了他一个新地址，说直接去这个地方。他瞟了眼地图，发现目的地是威斯汀布克卡迪拉克酒店，顿时又觉得脸上有一部分皮肤从耳朵后面开始烧起来。他说：“我记得我今天早上不是从这家酒店出来的。”

　　“当然，因为昨天你喝醉了就跟头熊一样，我当然没办法拖着你去那么远的地方，只好就近找了个旅馆。”

　　“你今天早上怎么没和我说一声就走了？”借着刚好谈到这个话题的机会，汉克再一次问出了这个他想了一天的问题。

　　“我不是今天早上走的。”康纳回答：“昨晚你睡着以后我就走了。”

　　“噢。”汉克假装若无其事地撇撇嘴，往旁边瞄一眼，见他丝毫没有要解释刚才那句话的意思，便也不再多问。


　　到了酒店房间里后，不知是暖气开得太热还是别的什么缘故，汉克总觉得自己浑身都在冒汗，心脏跳得也比平时更快，敲得他胸腔发麻。他甚至怀疑康纳也听得到他的心跳声，只是为了保全他的面子而假装听不见一样。他扯了扯自己的领带，然后开始解扣子，忽然听到康纳干涩的嗓音、略带命令的语气说：“穿着。”

　　汉克当然不服气：“你爽完了就不管我了？让我射我就射？”

　　他一直顶嘴让康纳也有些恼火，皱着眉头问：“明天不上班了吗？”

　　上班一词果然很有效果，原本正蓄势待发准备酣畅淋漓大干一个晚上的汉克顿觉前途灰暗，草草送了两下就拔出来射在他腿间，泄了气的皮球一样倒在床上，蔫蔫地看着另一边坐着揉腰的总督，没两分钟心情又变得好起来，问他感觉怎么样。

　　“一会儿你洗个澡就早点回去休息吧。”康纳说。

　　“为什么？”

　　“不洗澡你不难受吗？”

　　“我说我为什么要回去，我不能在这儿睡吗？”

　　康纳没有马上回答，汉克心都碎了。怪不得上学时候那个交了几十任女朋友的兄弟劝导他千万不要勾搭高年级的女生，大个两三岁就比他多见识过少说几百人，愣凑上去只有被玩弄感情的份。汉克想到现在这个比他大了整整有三十岁，比他多见识过几千几万人，说不定人家心里早就心有所属，只是拿他当根人形按摩棒一样使唤罢了，根本就不走心的。

　　想到这里汉克眼泪都快要掉下来，大喊一声：“你根本就不是真心跟我好！我再也不想看见你了！”然后提上裤子就往外跑。

　　十一月底特律的冷风吹得他眼泪鼻涕乱飞，跑出酒店才想起自己来酒店是搭总督的车来的，而且一说去医院就急吼吼走了连警服都没换，钱包和手机都在外套里，他现在身无分文，只剩下口袋里一枚下午在医院里从总督那儿抢来的钢镚。他在公交站台等了半天车，期间那些美好回忆一遍遍拿出来咀嚼，他的哭他的笑，他的皱纹他的痣，他们的初见他们的离别，脑子里自动匹配BillBoard榜单上排名前三的伤感热歌循环播放。

　　公交车到站的时候他眼泪都快冻在脸上，手心的硬币确却是热的，刚要投进投币机里的时候他面前又浮现起康纳温和的笑脸，一想到这枚硬币很有可能是他留给自己最后的礼物，汉克又舍不得就这么把钱花出去。他离开了公交站台，一步一步走回了家。

　　一回家他立刻拿起电话拨了个号码出去，刚接通就声泪俱下地诉说自己如何被欺骗感情又被欺骗肉体，长这么大从来都没有像这样爱过一个人，以后再也不会爱上任何一个人了，这个无情的人带走了他所有的悲欢喜乐，往后他要变得冷酷冷血、刀枪不入。

　　福勒说操你妈，现在是半夜两点。

　　然而成年人不同于小学生的地方在于就算是前一天晚上经历了人生最大的失恋，第二天还得起来上班，妈妈不可能因为这一点小事就一个电话打到局长办公室里说我们家小汉克今天心情非常差劲所以没法去警局了，我要带他去水上乐园痛快一天改善一下心情。汉克一晚上吃光了整整两桶冰激凌，第二天依旧准时出现在了工位上。

　　进警局前他看见门口停着那辆熟悉的黑色福特，刚止住没两个小时的眼泪又快要掉下来。他告诉自己这样不行，他现在是加勒比海上的戴维·琼斯、奥兹国的铁皮人、Care Bears的无心熊，没有心才能让他在这场残酷的情感斗争中占据绝对的高地。他做了几分钟激烈的思想斗争，天使翅膀和长着恶魔角的两个小人在他头上转着圈飞来飞去，一个告诉他：你就原谅他吧，爱能治愈一切，用一个仇恨去掩盖另一个仇恨只是在伤口上撒盐；一个告诉他：你要冷酷到底，从此不再与他多说一句话，让他也知道失去爱人到底是什么滋味，这才叫复仇，宝贝儿。

　　汉克黑着脸走进办公区，却意料之外地没看见昨天那个让他哭了一整晚的人坐在他对面，桌上空荡荡的。他连忙四周环视一圈，最终在福勒办公室里看到那个穿着黑色长外套的人正笑得满面春风，眼镜都快要从鼻子上滑下来。汉克吸了吸鼻子，坐在工位上，打开电脑心不在焉地点开几份文件后就开始撑着脑袋发呆。

　　过了一会儿康纳走出来，走到他对面把外套脱下挂在椅背上，坐下时轻声吸了口气。汉克在内心的小恶魔开口之前飞快抬了抬眼皮往对面看了一眼，看到康纳脖子上还围了条围巾。

　　他感冒了吗？他想。

　　对，他昨天一定是在你跑出去后心生悔意，所以跑出来找你，在雪地里找了你一夜，所以冻感冒了。你现在快去关心一下他，再给他倒杯热咖啡，他今晚一定还会邀请你去酒店。长着翅膀、头上顶个光圈的白色小人说。

　　痴心妄想！手里拿了把黑色叉子的黑色小人和他吵起来：他昨天分明就是拿你当炮友、419，他根本就没有关心过你，你现在何必再去关心他？好让他觉得你是easy boy可以招之即来挥之即去？我是说，Pornhub会员还要9.99刀一个月呢，你昨天可是在他身上辛勤耕耘了几个小时，而他甚至没有请你吃晚饭！

　　汉克觉得他们说得都有道理，一时拿不定主意，听见对面的人喊他名字，差点儿下意识就开了口，好在及时反应过来，低着头看着平板电脑，一声不吭就当没听到一样。

<script>
// =================================
// 章节设置
// =================================

const chapters = [
    { title: "第一章", id: "chapter-1" },
    { title: "第二章", id: "chapter-2" },
    { title: "第三章", id: "chapter-3" }
];

const story = document.getElementById("story");
const chapterTitle = document.getElementById("chapter-title");
const menu = document.getElementById("menu");

let currentChapter = 0;
let fontSize = 17;

// =================================
// 生成章节目录
// =================================

function buildMenu() {
    const list = document.getElementById("chapter-list");
    list.innerHTML = "";

    chapters.forEach((chapter, index) => {
        const button = document.createElement("button");

        button.textContent = chapter.title;
        button.classList.toggle("active", index === currentChapter);

        button.onclick = () => {
            loadChapter(index);
            menu.classList.remove("open");
        };

        list.appendChild(button);
    });
}

// =================================
// 加载章节
// =================================

function loadChapter(index, restorePosition = false) {
    if (index < 0 || index >= chapters.length) return;

    currentChapter = index;

    const chapter = chapters[index];

    chapterTitle.textContent = chapter.title;

    const rawText = document
        .getElementById(chapter.id)
        .textContent
        .trim();

    story.replaceChildren();

    // 空行分段
    const paragraphs = rawText.split(/\r?\n\s*\r?\n/);

    paragraphs.forEach(text => {
        if (!text.trim()) return;

        const p = document.createElement("p");
        p.textContent = text.trim();
        story.appendChild(p);
    });

    document.getElementById("prev-btn").disabled =
        index === 0;

    document.getElementById("next-btn").disabled =
        index === chapters.length - 1;

    localStorage.setItem("novelChapter", index);

    buildMenu();

    if (restorePosition) {
        const savedY = Number(
            localStorage.getItem("novelScroll") || 0
        );

        requestAnimationFrame(() => {
            window.scrollTo(0, savedY);
        });
    } else {
        window.scrollTo(0, 0);
        localStorage.setItem("novelScroll", 0);
    }
}

// =================================
// 切换章节
// =================================

function changeChapter(direction) {
    loadChapter(currentChapter + direction);
}

// =================================
// 打开 / 关闭目录
// =================================

function toggleMenu() {
    menu.classList.toggle("open");
}

// =================================
// 字体大小
// =================================

function resizeText(n) {
    fontSize = Math.max(14, Math.min(26, fontSize + n));
    story.style.fontSize = fontSize + "px";
    localStorage.setItem("novelFontSize", fontSize);
}

// =================================
// 夜间模式
// =================================

function toggleDark() {
    document.body.classList.toggle("dark");

    localStorage.setItem(
        "novelDark",
        document.body.classList.contains("dark")
    );
}

// =================================
// 保存阅读位置
// =================================

let scrollSavePending = false;

window.addEventListener("scroll", () => {
    if (scrollSavePending) return;

    scrollSavePending = true;

    requestAnimationFrame(() => {
        localStorage.setItem(
            "novelScroll",
            window.scrollY
        );
        scrollSavePending = false;
    });
});

// =================================
// 初始化
// =================================

const savedFont = Number(
    localStorage.getItem("novelFontSize")
);

if (savedFont >= 14 && savedFont <= 26) {
    fontSize = savedFont;
}

story.style.fontSize = fontSize + "px";

if (localStorage.getItem("novelDark") === "true") {
    document.body.classList.add("dark");
}

const savedChapter = Number(
    localStorage.getItem("novelChapter") || 0
);

loadChapter(
    Number.isInteger(savedChapter) &&
    savedChapter >= 0 &&
    savedChapter < chapters.length
        ? savedChapter
        : 0,
    true
);

</script>
